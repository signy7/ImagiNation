    <path d="M64 493H1216" stroke="#DCE4F2" stroke-width="2"/>
    <text x="68" y="544" font-family="'Trebuchet MS','Segoe UI','Microsoft YaHei',sans-serif" font-size="23" fill="#304ED8" >Preserve the glory. Defend the architecture. Prevent implementation.</text>
    <text x="68" y="599" font-family="'Trebuchet MS','Segoe UI','Microsoft YaHei',sans-serif" font-size="22" fill="#142439" >Our nation is ImagiNation.</text>
    <text x="68" y="652" font-family="'Trebuchet MS','Segoe UI','Microsoft YaHei',sans-serif" font-size="19" fill="#60708B" >Open-source satire. Fictional architecture and benchmarks.</text>
    <text x="68" y="681" font-family="'Trebuchet MS','Segoe UI','Microsoft YaHei',sans-serif" font-size="18" fill="#60708B" >About confusing tool access with professional expertise.</text>
