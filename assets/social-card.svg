    <text x="64" y="191" font-family="'Trebuchet MS','Segoe UI','Microsoft YaHei',sans-serif" font-size="86" fill="#142439" font-weight="700" letter-spacing="-3">ImagiNation</text>
    <text x="68" y="288" font-family="'Trebuchet MS','Segoe UI','Microsoft YaHei',sans-serif" font-size="46" fill="#142439" >Brains in the cloud.</text>
    <text x="68" y="355" font-family="'Trebuchet MS','Segoe UI','Microsoft YaHei',sans-serif" font-size="46" fill="#142439" >Superiority on localhost.</text>
    <text x="68" y="436" font-family="'Trebuchet MS','Segoe UI','Microsoft YaHei',sans-serif" font-size="23" fill="#60708B" >AI as an external brain. Generation instead of thought.</text>
