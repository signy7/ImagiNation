    <text x="68" y="352" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="44" fill="#142439" >基础设施。</text>
    <text x="68" y="421" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="22" fill="#60708B" >从工具访问资格，到跨领域话语权。</text>
