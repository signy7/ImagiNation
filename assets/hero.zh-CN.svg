    <text x="135" y="75" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="20" fill="#60708B" >认知云原生，权威本地优先。</text>
    <text x="64" y="218" font-family="'Trebuchet MS','Segoe UI','Microsoft YaHei',sans-serif" font-size="92" fill="#142439" font-weight="700" letter-spacing="-4">ImagiNation</text>
