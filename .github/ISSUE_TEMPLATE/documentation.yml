name: Documentation / 文档问题
description: Report a wording, translation, link, or rendering problem / 报告文字、翻译、链接或渲染问题
title: "[Docs] "
body:
  - type: markdown
    attributes:
      value: |
        Improve the documents without implementing the product. / 改进文档，杜绝实现。
        Criticism of GPT and this project is welcome. / 欢迎批评 GPT 与本项目。
  - type: checkboxes
    id: access-test
    attributes:
      label: GitHub home-page access test / GitHub 首页访问测试
      options:
        - label: "I opened https://github.com in a browser and the home page loaded. / 我已用浏览器打开 https://github.com，且首页加载成功。"
          required: true
  - type: input
    id: affected-file
    attributes:
      label: Affected file or section / 受影响的文件或章节
      placeholder: README.md — Quick Start
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem and proposed correction / 问题与建议修正
      description: Describe the problem and the proposed correction in each affected language. / 说明问题以及各受影响语言版本需要做的修改。
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope / 范围
      options:
        - label: This request introduces no business code or runtime dependencies. / 本请求不引入业务代码或运行依赖。
          required: true
