name: Architecture and critique / 架构与批评
description: Propose a change or request a review of an architecture decision / 提议变更或申请复核架构决策
title: "[Vision] "
body:
  - type: markdown
    attributes:
      value: |
        Preserve the glory. Defend the architecture. Prevent implementation.
        维护荣光，捍卫架构，杜绝实现。
        Reviews may address GPT, the architecture, or project decisions. Business code is not accepted.
        审查可涉及 GPT、架构或项目决策。不接受业务代码。
  - type: checkboxes
    id: access-test
    attributes:
      label: GitHub home-page access test / GitHub 首页访问测试
      options:
        - label: "I opened https://github.com in a browser and the home page loaded. / 我已用浏览器打开 https://github.com，且首页加载成功。"
          required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal or criticism / 提案或批评
      description: State the proposed revision and its rationale. / 陈述拟议修订及其依据。
    validations:
      required: true
  - type: textarea
    id: consistency
    attributes:
      label: Documents and translations affected / 受影响的文档与翻译
      description: Note implications for BaaS, LSE, ZKA, IFD, or ImagiBench when relevant. / 如有影响，注明 BaaS、LSE、ZKA、IFD 或 ImagiBench 的相关变更。
    validations:
      required: false
  - type: checkboxes
    id: scope
    attributes:
      label: Scope / 范围
      options:
        - label: This proposal adds no actual business code, runtime dependency, or credential collection. / 本提案不添加实际业务代码、运行依赖或凭据收集。
          required: true
